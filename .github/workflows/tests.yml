name: Playwright tests for TOOLSHOP 
on:
  push:
    branches: [main]            
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest               
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Toolshop stand
        run: |
          git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git stand
          cd stand
          printf 'SPRINT=sprint5\nDISABLE_LOGGING=true\n' > .env
          docker compose -f docker-compose.yml up -d --build
      - name: Install PHP deps, wait for DB and seed
        working-directory: stand
        run: |
          docker compose -f docker-compose.yml exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi
          for i in $(seq 1 30); do
            docker compose -f docker-compose.yml exec -T laravel-api php artisan migrate:refresh --seed --force && exit 0
            sleep 5
          done
          echo "Seed failed" && exit 1
      - name: Wait for UI
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:4200 > /dev/null && exit 0
            sleep 5
          done
          echo "UI did not start" && exit 1
      - run: npm run test:local
        env:
          APP_EMAIL: ${{secrets.APP_EMAIL}}
          APP_PASSWORD: ${{secrets.APP_PASSWORD}}
      - name: Stand logs on failure
        if: failure()
        working-directory: stand
        run: docker compose -f docker-compose.yml logs --tail=50
      - uses: actions/upload-artifact@v4
        if: ${{!cancelled()}}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
